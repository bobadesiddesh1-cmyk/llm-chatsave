<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Threadkeeper — a spool of thread. Source of truth for icons/icon*.png.
       Deep ink-green field, cream flanges, gold thread body. No gradients: a bold
       single silhouette that stays legible at 16px. -->
  <rect x="2" y="2" width="96" height="96" rx="23" fill="#15211F"/>
  <!-- thread wound on the spool -->
  <rect x="34" y="30" width="32" height="40" fill="#E0A33E"/>
  <path d="M34 40 h32 M34 50 h32 M34 60 h32" stroke="#15211F" stroke-width="4"/>
  <!-- flanges -->
  <rect x="25" y="21" width="50" height="10" rx="5" fill="#FBF6EC"/>
  <rect x="25" y="69" width="50" height="10" rx="5" fill="#FBF6EC"/>
</svg>
